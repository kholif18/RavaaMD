# RavaaMD (Ravaa Media Downloader) — jalankan dari folder ini:
#   docker compose up -d --build
# Hentikan:  docker compose down
#
# network_mode: host + --host 0.0.0.0 = pola TERBUKTI (uji e2e 2026-11-03):
#   * Aplikasi bind loopback di dalam container. Dengan host network ia melayani
#     SEMUA interface mesin → laptop/HP di LAN buka http://IP-SERVER:8637
#     (akses cepat, tanpa Cloudflare; BUKA PORT di firewalld dulu, lihat README),
#     dan tunnel Cloudflare (di luar rumah) menunjuk http://127.0.0.1:8637.
#   * Tanpa port-publish docker biasa (biasa TIDAK sampai karena app loopback
#     di dalam container) — jangan ubah ke "-p 8637:8637".
#   * TANPA auth — hanya untuk LAN rumah yang dipercaya; jangan publish ke
#     internet langsung tanpa Access policy.
#
# Server = converter murni: TANPA folder tujuan / volume musik. Hasil convert
# tinggal sebentar di folder kerja (RAVAAMD_WORK), dikirim ke perangkat lewat
# /api/fetch, lalu dihapus — tidak ada yang disimpan di server.
services:
  ravaamd:
    build: .
    image: ravaamd:latest
    container_name: ravaamd
    restart: unless-stopped
    network_mode: host
    environment:
      - RAVAAMD_WORK=/tmp/ravaamd-work
    command: ["--no-browser", "--host", "0.0.0.0"]
